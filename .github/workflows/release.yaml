# Push a tag like v1.2.0 → tests, signed + notarized Decant.app, GitHub release with the zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - run: swift test

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          pass=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$pass" $keychain
          security set-keychain-settings -lut 21600 $keychain
          security unlock-keychain -p "$pass" $keychain
          security import $RUNNER_TEMP/cert.p12 -k $keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" $keychain
          security list-keychains -d user -s $keychain $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12

      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: Developer ID Application
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY }}
        run: |
          export NOTARY_KEY=$RUNNER_TEMP/notary.p8
          echo "$NOTARY_KEY_B64" | base64 --decode > $NOTARY_KEY
          scripts/build-app.sh "${GITHUB_REF_NAME#v}"
          spctl --assess --type execute -vv .build/Decant.app

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/Decant-*.zip --title "Decant ${GITHUB_REF_NAME#v}" --generate-notes
