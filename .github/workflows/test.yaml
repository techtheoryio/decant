name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: xcode-27  # preview image; macos-26 tops out at Xcode 26.6, whose Swift 6.3 has IRGen crashes
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: swift test
      - run: swift build -c release  # the app target has no tests; make sure it still compiles
